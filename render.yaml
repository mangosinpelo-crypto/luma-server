services:
  - type: web
    name: luma-server
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3001
      - key: FRONTEND_URL
        sync: false
      - key: DEEPINFRA_API_KEY
        sync: false
      - key: FREE_MODEL
        value: mistralai/Mistral-Nemo-Instruct-2407
      - key: PREMIUM_MODEL
        value: NousResearch/Hermes-3-Llama-3.1-70B
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PREMIUM
        sync: false
      - key: STRIPE_PRICE_OBSESION
        sync: false
